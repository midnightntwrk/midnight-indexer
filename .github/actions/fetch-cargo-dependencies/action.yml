name: Fetch Cargo Dependencies
description: Fetch every locked cargo dependency, authenticating the ledger repository's git fetches
inputs:
  token:
    description: Token with read access to the ledger repository
    required: true
runs:
  using: composite
  steps:
    # The checkout before this action must set `persist-credentials: false`: git sends the
    # GITHUB_TOKEN header that checkout stores for all of github.com in place of this token, and
    # GITHUB_TOKEN cannot read other repositories. The token reaches only this fetch, which runs
    # no build script; later steps build from the fetched sources without it.
    - name: Fetch cargo dependencies
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: |
        repository=https://github.com/shieldedtech/embargo-2026-10-midnight-ledger
        # libgit2, cargo's default git client, ignores git config credentials.
        GIT_CONFIG_COUNT=1 \
        GIT_CONFIG_KEY_0="url.https://x-access-token:${TOKEN}@${repository#https://}.insteadOf" \
        GIT_CONFIG_VALUE_0="$repository" \
        CARGO_NET_GIT_FETCH_WITH_CLI=true \
          cargo fetch --locked
