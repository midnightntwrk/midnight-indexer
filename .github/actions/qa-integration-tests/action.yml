name: QA integration tests
description: >-
  Run the QA smoke and integration suites against a target environment, standing
  a local docker-compose stack up first when the target is `undeployed`.

  A composite rather than a reusable workflow because a job with `uses:` cannot
  carry `continue-on-error`, which is what forced the QA run into a separate
  workflow_run-triggered workflow. Callers that want their own workflow run wrap
  this in qa-integration-tests-base-workflow.yml.

inputs:
  target_env:
    description: Midnight target environment (undeployed/devnet/qanet/preview/preprod)
    required: true
  node_tag:
    description: Node image tag (undeployed only)
    required: false
    default: latest
  indexer_tag:
    description: Indexer image tag (undeployed only)
    required: false
    default: latest
  node_toolkit_tag:
    description: Node toolkit image tag (undeployed only; empty uses the startup script default)
    required: false
    default: ""
  image_registry:
    description: >-
      Registry for the indexer images (empty uses the docker-compose default,
      Docker Hub midnightntwrk). Per-commit main-branch builds are published to
      GHCR only, so callers testing those images must set this explicitly.
    required: false
    default: ""
  publish_to_xray:
    description: Publish the test results to Xray
    required: false
    default: "false"
  packages_read_token:
    description: Token with read access to the GHCR packages and the npm registry
    required: true
  app_infra_secret:
    description: APP__INFRA__SECRET for the local stack (undeployed only)
    required: false
    default: ""
  storage_password:
    description: APP__INFRA__STORAGE__PASSWORD for the local stack (undeployed only)
    required: false
    default: ""
  pub_sub_password:
    description: APP__INFRA__PUB_SUB__PASSWORD for the local stack (undeployed only)
    required: false
    default: ""
  xray_client_id:
    description: Xray client id (only read when publish_to_xray is true)
    required: false
    default: ""
  xray_client_secret:
    description: Xray client secret (only read when publish_to_xray is true)
    required: false
    default: ""

runs:
  using: composite
  steps:
    # A composite has no job-level `env:`, so the block the base workflow used to
    # set once is repeated on the steps that read it. Deliberate: writing it to
    # $GITHUB_ENV instead would put action inputs on the environment-file path
    # and buy a zizmor `github-env` suppression for the privilege.
    - name: Setup Node.js v22.x
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22.x

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.13

    - name: Login to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: MidnightCI
        password: ${{ inputs.packages_read_token }}

    # Pulling up front keeps registry/auth/tag failures out of the startup step
    # (they fail here with a one-glance log instead) and lets the step timings
    # separate download time from environment startup time. Images already
    # present make this a cheap manifest check.
    - name: Pull images
      if: inputs.target_env == 'undeployed'
      shell: bash
      env:
        NODE_TAG: ${{ inputs.node_tag }}
        INDEXER_TAG: ${{ inputs.indexer_tag }}
        NODE_TOOLKIT_TAG: ${{ inputs.node_toolkit_tag }}
        IMAGE_REGISTRY: ${{ inputs.image_registry }}
      run: |
        docker compose --profile cloud pull
        # Used by qa/scripts/startup-localenv-with-data.sh for volume setup.
        docker pull alpine
        # Used by the toolkit wrapper for test data generation; the registry is
        # hardcoded there (qa/tests/utils/toolkit/toolkit-wrapper.ts) and this
        # pull must match it. The tag default mirrors
        # startup-localenv-with-data.sh. Docker Hub's
        # midnightntwrk/midnight-node-toolkit cannot be used here: it only
        # carries the toolkit's own release tags and latest-main, not the
        # node-paired tags this action passes.
        docker pull "ghcr.io/midnight-ntwrk/midnight-node-toolkit:${NODE_TOOLKIT_TAG:-latest-main}"

    - name: Startup local environment
      if: inputs.target_env == 'undeployed'
      shell: bash
      env:
        NODE_TAG: ${{ inputs.node_tag }}
        INDEXER_TAG: ${{ inputs.indexer_tag }}
        NODE_TOOLKIT_TAG: ${{ inputs.node_toolkit_tag }}
        # Empty falls through to the docker-compose default (midnightntwrk).
        IMAGE_REGISTRY: ${{ inputs.image_registry }}
        APP__INFRA__SECRET: ${{ inputs.app_infra_secret }}
        APP__INFRA__STORAGE__PASSWORD: ${{ inputs.storage_password }}
        APP__INFRA__PUB_SUB__PASSWORD: ${{ inputs.pub_sub_password }}
      run: |
        # No APP__INFRA__* secrets are configured for this repo (repo and org
        # level), leaving these empty - an empty POSTGRES_PASSWORD makes the
        # postgres container restart-loop and the whole environment never comes
        # up. The local environment is ephemeral, so random values suffice (same
        # approach as .github/actions/init-env); secrets still win when present.
        export APP__INFRA__SECRET="${APP__INFRA__SECRET:-$(openssl rand -hex 32)}"
        export APP__INFRA__STORAGE__PASSWORD="${APP__INFRA__STORAGE__PASSWORD:-$(openssl rand -hex 32)}"
        export APP__INFRA__PUB_SUB__PASSWORD="${APP__INFRA__PUB_SUB__PASSWORD:-$(openssl rand -hex 32)}"

        . ./.envrc
        echo "NODE_TAG: $NODE_TAG"
        echo "INDEXER_TAG: $INDEXER_TAG"
        bash ./qa/scripts/startup-localenv-with-data.sh

    - name: Install dependencies
      shell: bash
      working-directory: qa/tests
      env:
        GITHUB_TOKEN: ${{ inputs.packages_read_token }}
        NODE_AUTH_TOKEN: ${{ inputs.packages_read_token }}
      run: bun install --frozen-lockfile

    - name: Run smoke tests
      shell: bash
      working-directory: qa/tests
      env:
        TARGET_ENV: ${{ inputs.target_env }}
        GITHUB_TOKEN: ${{ inputs.packages_read_token }}
        NODE_AUTH_TOKEN: ${{ inputs.packages_read_token }}
        LOG_LEVEL: DEBUG
        XRAY_COMPONENT: indexer
        XRAY_PROJECT_KEY: PM
        XRAY_TEST_PLAN_KEY: PM-19197
        XRAY_REPORT_TESTS_MISSING_METADATA: "false"
      run: bun run test smoke

    - name: Run integration tests
      shell: bash
      working-directory: qa/tests
      env:
        TARGET_ENV: ${{ inputs.target_env }}
        GITHUB_TOKEN: ${{ inputs.packages_read_token }}
        NODE_AUTH_TOKEN: ${{ inputs.packages_read_token }}
        LOG_LEVEL: DEBUG
        XRAY_COMPONENT: indexer
        XRAY_PROJECT_KEY: PM
        XRAY_TEST_PLAN_KEY: PM-19197
        XRAY_REPORT_TESTS_MISSING_METADATA: "false"
      run: bun run test integration

    - name: Generate API coverage report (non-blocking)
      if: always()
      shell: bash
      working-directory: qa/tests
      env:
        TARGET_ENV: ${{ inputs.target_env }}
      # `|| true` rather than `continue-on-error:`, which composite steps do not
      # take. Same effect: a coverage-tooling failure never reds the suite.
      run: bun run coverage:generate --target-env="$TARGET_ENV" --indexer-api-version=v4 || true

    - name: Publish to Xray
      if: always() && inputs.publish_to_xray == 'true'
      uses: GiuseppeSalvatoreShielded/TestActions/xray-upload@e5cf0c100e61b96f5bc73963312fc8064d7b2d2d
      with:
        test_results_path: ./qa/tests/reports/xray/test-results.json
        xray_client_id: ${{ inputs.xray_client_id }}
        xray_client_secret: ${{ inputs.xray_client_secret }}

    - name: Upload Integration Test Reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: junit-integration-test-reports-${{ inputs.target_env }}
        path: ./qa/tests/reports/custom-junit-report.xml
        if-no-files-found: warn

    - name: Upload XRay Test Reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: xray-integration-test-reports-${{ inputs.target_env }}
        path: ./qa/tests/reports/xray/test-results.json
        if-no-files-found: warn

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: qa-integration-tests-${{ inputs.target_env }}-logs
        path: ./qa/tests/logs

    - name: Upload API coverage report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: qa-api-coverage-${{ inputs.target_env }}
        path: ./qa/tests/coverage/output/**
        if-no-files-found: warn
