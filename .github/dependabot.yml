version: 2

updates:
  - package-ecosystem: "cargo"
    labels:
      - "bot:dependencies"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      all:
        patterns:
          - "*"
    ignore:
      - dependency-name: "fake"

  - package-ecosystem: "github-actions"
    labels:
      - "bot:github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    labels:
      - "bot:dependencies"
    # Each component keeps its Dockerfile in its own directory; "/" alone matches none of them.
    # Only digest- or version-pinned images are bumped; the cargo-chef builder tag embeds
    # $RUST_VERSION, so it is bumped by hand alongside rust-toolchain.toml.
    directories:
      - "/chain-indexer"
      - "/indexer-api"
      - "/indexer-standalone"
      - "/indexer-tests"
      - "/spo-indexer"
      - "/wallet-indexer"
      - "/qa/tests/utils/compact"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      all:
        patterns:
          - "*"
