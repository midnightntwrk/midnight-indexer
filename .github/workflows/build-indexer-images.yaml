name: build-indexer-images

permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
    inputs:
      node_tag:
        description: "Node tag to use for testing (e.g., 0.13.2-rc.1)"
        required: false
        type: string
      profile:
        description: "Build profile"
        required: false
        type: choice
        default: dev
        options:
          - dev
          - release

concurrency:
  group: build-indexer-images
  cancel-in-progress: false

env:
  # Embeds the crate list in every binary for image scanners. Pinned: bump deliberately. The
  # justfile reads this line for local image builds, so keep it a plain `key: value`.
  CARGO_AUDITABLE_VERSION: 0.7.7
  # Builds the cargo chef dependency layer. Pinned: bump deliberately; the justfile reads this too.
  CARGO_CHEF_VERSION: 0.1.78

jobs:
  # cargo-chef and cargo-auditable run inside every image build, but their locked dependencies are
  # outside the workspace Cargo.lock that rust-security-scan checks. Check the exact pinned
  # versions here, so an advisory against a build tool blocks image publishing, not pull requests.
  check-build-tools:
    name: Check build tools for advisories
    runs-on: ubuntu-latest
    # No checkout and no GitHub API calls: the job needs no token permissions.
    permissions: {}
    steps:
      - name: Install cargo-deny
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          # Same pin as rust-security-scan; see the note there before bumping.
          tool: cargo-deny@0.20.2

      - name: Fetch the pinned build tools
        run: |
          for tool in "cargo-chef@$CARGO_CHEF_VERSION" "cargo-auditable@$CARGO_AUDITABLE_VERSION"; do
            name=${tool%@*}
            version=${tool#*@}
            checksum=$(curl -fsSL -A "midnight-indexer-ci" "https://crates.io/api/v1/crates/$name/$version" |
              jq -r .version.checksum)
            curl -fsSL -o "$name.crate" "https://static.crates.io/crates/$name/$name-$version.crate"
            echo "$checksum  $name.crate" | sha256sum -c -
            mkdir "$name"
            tar -xzf "$name.crate" -C "$name" --strip-components 1
          done

      - name: Run cargo-deny on their lockfiles
        # --locked checks the Cargo.lock each crate ships, which is what `cargo install --locked`
        # builds. -Aunmaintained matches rust-security-scan. Ignores are for build tools only;
        # remove each once a pinned release ships a lockfile without it.
        run: |
          cat > build-tools-deny.toml <<'EOF'
          [advisories]
          ignore = [
            { id = "RUSTSEC-2026-0190", reason = "anyhow 1.0.102 in cargo-chef 0.1.78's lockfile; cargo-chef never calls Error::downcast_mut, and no cargo-chef release locks anyhow >= 1.0.103 yet" },
            { id = "RUSTSEC-2026-0204", reason = "crossbeam-epoch 0.9.18 in cargo-chef 0.1.78's lockfile, reached only through ignore's directory walker, which never formats Atomic/Shared pointers; no cargo-chef release locks >= 0.9.20 yet" },
          ]
          EOF
          for name in cargo-chef cargo-auditable; do
            cargo deny --manifest-path "$name/Cargo.toml" --locked --config build-tools-deny.toml \
              check -Aunmaintained advisories
          done

  build-and-push:
    name: Build and push (${{ matrix.image.name }}, ${{ matrix.platform.arch }})
    needs: check-build-tools
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      packages: write
    env:
      PROFILE: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || inputs.profile || 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: chain-indexer
            description: Midnight Chain Indexer
          - name: indexer-api
            description: Midnight Indexer API
          - name: wallet-indexer
            description: Midnight Wallet Indexer
          - name: indexer-standalone
            description: Midnight Indexer
          - name: spo-indexer
            description: Midnight SPO Indexer
        # Each (image, arch) is an independent parallel job publishing an arch-suffixed tag, built
        # natively on a runner of that arch (the same runner labels midnight-node uses). amd64 keeps
        # the existing (warm) buildcache ref. Neither blocks the other, and each -amd64/-arm64 tag is
        # available as soon as that arch finishes. The downstream merge-manifests job then assembles
        # the unsuffixed tag into a real multi-arch manifest referencing both arches.
        platform:
          - arch: amd64
            runner: ubuntu-latest-16-core-x64
            suffix: "-amd64"
            cache_scope: ""
          - arch: arm64
            runner: ubuntu-latest-8-core-arm64
            suffix: "-arm64"
            cache_scope: "-arm64"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes to git; keep GITHUB_TOKEN out of .git/config for later steps.
          persist-credentials: false

      - name: Set up environment
        env:
          toolchain_toml: "rust-toolchain.toml"
        run: |
          toolchain=$(grep channel rust-toolchain.toml | sed -r 's/channel = "(.*)"/\1/')
          echo "TOOLCHAIN=$toolchain" | tee -a "$GITHUB_ENV"
          version=$(grep '^version.*=' Cargo.toml | sed -E 's/version.*=.*"(.*)"/\1/')
          echo "VERSION=$version" | tee -a "$GITHUB_ENV"

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_USER }}
          password: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: MidnightCI
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Setup Docker Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 8
        with:
          # midnight-ntwrk is the legacy GitHub org, dual-published to the current
          # midnightntwrk org until it is sunset. Tag builds also push to Docker
          # Hub, which is the registry docker-compose.yaml defaults to.
          images: |
            ghcr.io/midnight-ntwrk/${{ matrix.image.name }}
            ghcr.io/midnightntwrk/${{ matrix.image.name }}
            ${{ github.ref_type == 'tag' && format('midnightntwrk/{0}', matrix.image.name) || '' }}
          # onlatest arch-suffixes the `latest` tag release tags get, which merge-manifests expects.
          flavor: |
            suffix=${{ matrix.platform.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            ${{ github.ref_type != 'tag' && format('type=sha,prefix={0}-,format=short', env.VERSION) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/midnightntwrk/midnight-indexer/
            org.opencontainers.image.title=${{ matrix.image.name }}
            org.opencontainers.image.description=${{ matrix.image.description }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build into the local Docker daemon and check the image before anything is published. The
      # push below then rebuilds from this builder's cache, so the image is only built once.
      - name: Build Docker Image for checks
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./${{ matrix.image.name }}/Dockerfile
          # Export the image to the runner's Docker daemon (`buildx build --load`) instead of
          # leaving it in the BuildKit container, so syft can read it as docker:<tag>. Not pushed:
          # `local/` below is only a tag name. Works because each job builds a single platform.
          load: true
          # Anchored here and reused by the push step below, so both builds match and share a cache.
          build-args: &build-args |
            PROFILE=${{ env.PROFILE }}
            RUST_VERSION=${{ env.TOOLCHAIN }}
            CARGO_AUDITABLE_VERSION=${{ env.CARGO_AUDITABLE_VERSION }}
            CARGO_CHEF_VERSION=${{ env.CARGO_CHEF_VERSION }}
          platforms: linux/${{ matrix.platform.arch }}
          tags: local/${{ matrix.image.name }}:check
          cache-from: &cache-from |
            type=registry,ref=ghcr.io/midnight-ntwrk/${{ matrix.image.name }}:buildcache${{ matrix.platform.cache_scope }}
            type=registry,ref=ghcr.io/midnight-ntwrk/${{ matrix.image.name }}:buildcache-${{ env.PROFILE }}${{ matrix.platform.cache_scope }}

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

      # The point of building with cargo auditable: an image scanner must see the binary's crates.
      - name: Check the image SBOM lists the Rust crates
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          IMAGE: local/${{ matrix.image.name }}:check
        run: |
          "$SYFT" scan "docker:$IMAGE" -o syft-json=sbom.syft.json
          crates=$(jq '[.artifacts[] | select(.type == "rust-crate")] | length' sbom.syft.json)
          echo "syft found $crates Rust crates in $IMAGE"
          if [ "$crates" -eq 0 ]; then
            echo "::error::syft found no Rust crates in $IMAGE; its cargo auditable data is missing or unreadable"
            exit 1
          fi

      # Scan what would ship, before it ships. Only vulnerabilities with a fix fail the build:
      # an unfixed one in the Debian base can only be waited out. Accepted findings go in a
      # .grype.yaml at the repository root, with the reason and when to remove them.
      - name: Scan the image SBOM for vulnerabilities
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          "$GRYPE" sbom:sbom.syft.json --fail-on high --only-fixed

      - name: Build and push Docker Image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./${{ matrix.image.name }}/Dockerfile
          push: true
          build-args: *build-args
          platforms: linux/${{ matrix.platform.arch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: *cache-from
          cache-to: |
            type=registry,ref=ghcr.io/midnight-ntwrk/${{ matrix.image.name }}:buildcache${{ matrix.platform.cache_scope }},mode=max
            type=registry,ref=ghcr.io/midnight-ntwrk/${{ matrix.image.name }}:buildcache-${{ env.PROFILE }}${{ matrix.platform.cache_scope }},mode=max

      # The check above scanned the local build, whose digest differs from the published image
      # (labels, attestations). Record the SBOM of what was actually pushed, by digest, so the
      # artifact can be matched to the image. Every target registry receives the same digest.
      # Informational only (the gate is the check before the push): the image is already
      # published, so a failure here must not fail the job and hold back merge-manifests.
      - name: Generate SBOM for the published image
        continue-on-error: true
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          IMAGE: ghcr.io/midnightntwrk/${{ matrix.image.name }}@${{ steps.push.outputs.digest }}
          PLATFORM: linux/${{ matrix.platform.arch }}
        run: |
          "$SYFT" scan "registry:$IMAGE" --platform "$PLATFORM" -o spdx-json=sbom.spdx.json

      - name: Upload SBOM
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: sbom.spdx.json

  merge-manifests:
    name: Merge multi-arch manifest (${{ matrix.image.name }})
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: chain-indexer
          - name: indexer-api
          - name: wallet-indexer
          - name: indexer-standalone
          - name: spo-indexer
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes to git; keep GITHUB_TOKEN out of .git/config for later steps.
          persist-credentials: false

      - name: Set up environment
        run: |
          version=$(grep '^version.*=' Cargo.toml | sed -E 's/version.*=.*"(.*)"/\1/')
          echo "VERSION=$version" | tee -a "$GITHUB_ENV"

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_USER }}
          password: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: MidnightCI
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Recompute the unsuffixed tags exactly as the build-and-push job did (same images/tags,
      # no suffix). For each tag T we combine the already-published T-amd64 and T-arm64 into a
      # single multi-arch manifest published as T.
      - name: Setup Docker Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 8
        with:
          # Keep in sync with the images list in build-and-push.
          images: |
            ghcr.io/midnight-ntwrk/${{ matrix.image.name }}
            ghcr.io/midnightntwrk/${{ matrix.image.name }}
            ${{ github.ref_type == 'tag' && format('midnightntwrk/{0}', matrix.image.name) || '' }}
          tags: |
            type=semver,pattern={{version}}
            ${{ github.ref_type != 'tag' && format('type=sha,prefix={0}-,format=short', env.VERSION) || '' }}

      - name: Merge per-arch images into multi-arch manifests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "$TAGS" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Merging ${tag} from ${tag}-amd64 + ${tag}-arm64"
            docker buildx imagetools create -t "${tag}" "${tag}-amd64" "${tag}-arm64"
            docker buildx imagetools inspect "${tag}"
          done

  docker-compose-validation:
    name: Docker Compose Validation
    needs: merge-manifests
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        profile: [cloud, standalone]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes to git; keep GITHUB_TOKEN out of .git/config for later steps.
          persist-credentials: false

      - name: Docker versions
        run: |
          docker version
          docker compose version

      - name: Set up environment
        run: |
          version=$(grep '^version.*=' Cargo.toml | sed -E 's/version.*=.*"(.*)"/\1/')
          echo "VERSION=$version" | tee -a "$GITHUB_ENV"

      - name: Validate Docker Compose syntax
        run: |
          echo "Validating Docker Compose syntax for ${{ matrix.profile }} profile..."
          docker compose --profile ${{ matrix.profile }} config --quiet
          echo "Docker Compose syntax validation completed successfully"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: MidnightCI
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Setup Docker Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 8
        with:
          tags: |
            type=semver,pattern={{version}}
            ${{ github.ref_type != 'tag' && format('type=sha,prefix={0}-,format=short', env.VERSION) || '' }}

      - name: Set up Indexer Tag to target
        run: |
          echo "Raw tags output: ${{ steps.meta.outputs.tags }}"

          # Filter "latest" for release tags
          INDEXER_TAG=$(echo "${{ steps.meta.outputs.tags }}" | grep -v '^$' | grep -v '^latest$' | head -n1)

          if [ -z "$INDEXER_TAG" ]; then
            echo "Failed to extract INDEXER_TAG from tags output"
            echo "Available tags:"
            echo "${{ steps.meta.outputs.tags }}"
            exit 1
          fi

          echo "Using INDEXER_TAG=$INDEXER_TAG"
          echo "INDEXER_TAG=$INDEXER_TAG" >> "$GITHUB_ENV"

      - name: Set up Node Tag to target
        env:
          NODE_TAG_INPUT: ${{ github.event.inputs.node_tag }}
        run: |
          # Use workflow dispatch input if provided, otherwise read from NODE_VERSIONS file
          if [ -n "$NODE_TAG_INPUT" ]; then
            echo "Using node tag from workflow dispatch: $NODE_TAG_INPUT"
            echo "NODE_TAG=$NODE_TAG_INPUT" >> "$GITHUB_ENV"
          else
            echo "Reading node tag from NODE_VERSIONS file..."
            node_tag=$(tail -n 1 NODE_VERSIONS)
            echo "Using node tag: $node_tag"
            echo "NODE_TAG=$node_tag" >> "$GITHUB_ENV"
          fi

      - name: Set image registry
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "IMAGE_REGISTRY=ghcr.io/midnight-ntwrk" >> "$GITHUB_ENV"
          fi

      - name: Init Env Vars
        uses: ./.github/actions/init-env

      - name: Docker Compose Up
        run: |
          echo "Compose up with:"
          echo "- Indexer tag: $INDEXER_TAG"
          echo "- Node tag   : $NODE_TAG"
          echo "- Registry   : ${IMAGE_REGISTRY:-midnightntwrk}"
          docker compose --profile "${{ matrix.profile }}" up -d

      - name: Show running containers
        run: docker compose ps

      - name: Wait for services to be healthy
        run: |
          # Wait for up to 60 seconds for all healthchecks to pass
          for i in $(seq 1 12); do
            echo "Check for services to be healthy... attempt $i"
            unhealthy=$(docker compose ps |grep -E 'unhealthy|starting' || true)
            if [ -z "$unhealthy" ]; then
              echo "All services healthy!"
              exit 0
            else
              echo "Unhealthy services: $unhealthy"
            fi
            sleep 5
          done
          echo "Some services failed to become healthy:"
          exit 1

      - name: Show logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
