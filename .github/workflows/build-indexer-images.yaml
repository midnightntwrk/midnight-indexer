name: build-indexer-images

permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
    inputs:
      node_tag:
        description: "Node tag to use for testing (e.g., 0.13.2-rc.1)"
        required: false
        type: string

concurrency:
  group: build-indexer-images
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push (${{ matrix.image.name }}, ${{ matrix.platform.arch }})
    runs-on: ubuntu-latest-16-core-x64
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: chain-indexer
            description: Midnight Chain Indexer
          - name: indexer-api
            description: Midnight Indexer API
          - name: wallet-indexer
            description: Midnight Wallet Indexer
          - name: indexer-standalone
            description: Midnight Indexer
          - name: spo-indexer
            description: Midnight SPO Indexer
        # Each (image, arch) is an independent parallel job publishing an arch-suffixed tag.
        # amd64 keeps the existing (warm) buildcache ref and builds natively; arm64 builds in
        # parallel under QEMU. Neither blocks the other, and each -amd64/-arm64 tag is available
        # as soon as that arch finishes. The downstream merge-manifests job then assembles the
        # unsuffixed tag into a real multi-arch manifest referencing both arches.
        platform:
          - arch: amd64
            suffix: "-amd64"
            cache_scope: ""
          - arch: arm64
            suffix: "-arm64"
            cache_scope: "-arm64"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up environment
        env:
          toolchain_toml: "rust-toolchain.toml"
        run: |
          toolchain=$(grep channel rust-toolchain.toml | sed -r 's/channel = "(.*)"/\1/')
          echo "TOOLCHAIN=$toolchain" | tee -a "$GITHUB_ENV"
          version=$(grep '^version.*=' Cargo.toml | sed -E 's/version.*=.*"(.*)"/\1/')
          echo "VERSION=$version" | tee -a "$GITHUB_ENV"

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_USER }}
          password: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: MidnightCI
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Setup Docker Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 8
        with:
          # midnight-ntwrk is the legacy GitHub org, dual-published to the current
          # midnightntwrk org until it is sunset. Tag builds also push to Docker
          # Hub, which is the registry docker-compose.yaml defaults to.
          images: |
            ghcr.io/midnight-ntwrk/${{ matrix.image.name }}
            ghcr.io/midnightntwrk/${{ matrix.image.name }}
            ${{ github.ref_type == 'tag' && format('midnightntwrk/{0}', matrix.image.name) || '' }}
          flavor: |
            suffix=${{ matrix.platform.suffix }}
          tags: |
            type=semver,pattern={{version}}
            ${{ github.ref_type != 'tag' && format('type=sha,prefix={0}-,format=short', env.VERSION) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/midnightntwrk/midnight-indexer/
            org.opencontainers.image.title=${{ matrix.image.name }}
            org.opencontainers.image.description=${{ matrix.image.description }}

      - name: Setup QEMU
        if: matrix.platform.arch == 'arm64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: tonistiigi/binfmt:qemu-v8.1.5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          PROFILE: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'dev' }}
        with:
          context: .
          file: ./${{ matrix.image.name }}/Dockerfile
          push: true
          build-args: |
            PROFILE=${{ env.PROFILE }}
            RUST_VERSION=${{ env.TOOLCHAIN }}
          platforms: linux/${{ matrix.platform.arch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=ghcr.io/midnight-ntwrk/${{ matrix.image.name }}:buildcache${{ matrix.platform.cache_scope }}
            type=registry,ref=ghcr.io/midnight-ntwrk/${{ matrix.image.name }}:buildcache-${{ env.PROFILE }}${{ matrix.platform.cache_scope }}
          cache-to: |
            type=registry,ref=ghcr.io/midnight-ntwrk/${{ matrix.image.name }}:buildcache${{ matrix.platform.cache_scope }},mode=max
            type=registry,ref=ghcr.io/midnight-ntwrk/${{ matrix.image.name }}:buildcache-${{ env.PROFILE }}${{ matrix.platform.cache_scope }},mode=max

  merge-manifests:
    name: Merge multi-arch manifest (${{ matrix.image.name }})
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: chain-indexer
          - name: indexer-api
          - name: wallet-indexer
          - name: indexer-standalone
          - name: spo-indexer
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up environment
        run: |
          version=$(grep '^version.*=' Cargo.toml | sed -E 's/version.*=.*"(.*)"/\1/')
          echo "VERSION=$version" | tee -a "$GITHUB_ENV"

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_USER }}
          password: ${{ secrets.DOCKERHUB_MIDNIGHTNTWRK_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: MidnightCI
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Recompute the unsuffixed tags exactly as the build-and-push job did (same images/tags,
      # no suffix). For each tag T we combine the already-published T-amd64 and T-arm64 into a
      # single multi-arch manifest published as T.
      - name: Setup Docker Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 8
        with:
          # Keep in sync with the images list in build-and-push.
          images: |
            ghcr.io/midnight-ntwrk/${{ matrix.image.name }}
            ghcr.io/midnightntwrk/${{ matrix.image.name }}
            ${{ github.ref_type == 'tag' && format('midnightntwrk/{0}', matrix.image.name) || '' }}
          tags: |
            type=semver,pattern={{version}}
            ${{ github.ref_type != 'tag' && format('type=sha,prefix={0}-,format=short', env.VERSION) || '' }}

      - name: Merge per-arch images into multi-arch manifests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "$TAGS" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Merging ${tag} from ${tag}-amd64 + ${tag}-arm64"
            docker buildx imagetools create -t "${tag}" "${tag}-amd64" "${tag}-arm64"
            docker buildx imagetools inspect "${tag}"
          done

  docker-compose-validation:
    name: Docker Compose Validation
    needs: merge-manifests
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        profile: [cloud, standalone]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker versions
        run: |
          docker version
          docker compose version

      - name: Validate Docker Compose syntax
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          echo "Validating Docker Compose syntax for $PROFILE profile..."
          docker compose --profile "$PROFILE" config --quiet
          echo "Docker Compose syntax validation completed successfully"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: MidnightCI
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Derive image tags
        id: tags
        uses: ./.github/actions/derive-image-tags
        with:
          node_tag: ${{ inputs.node_tag }}

      - name: Export tags to the compose environment
        env:
          INDEXER_TAG: ${{ steps.tags.outputs.indexer_tag }}
          NODE_TAG: ${{ steps.tags.outputs.node_tag }}
        run: |
          # Every `docker compose` invocation below interpolates these, so they
          # have to be on the environment rather than passed per-step. Safe to
          # put on the environment file: derive-image-tags rejects any tag
          # outside [A-Za-z0-9._-], so neither can carry a newline.
          {
            echo "INDEXER_TAG=$INDEXER_TAG"
            echo "NODE_TAG=$NODE_TAG"
          } >> "$GITHUB_ENV"

      - name: Set image registry
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "IMAGE_REGISTRY=ghcr.io/midnight-ntwrk" >> "$GITHUB_ENV"
          fi

      - name: Init Env Vars
        uses: ./.github/actions/init-env

      - name: Docker Compose Up
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          echo "Compose up with:"
          echo "- Indexer tag: $INDEXER_TAG"
          echo "- Node tag   : $NODE_TAG"
          echo "- Registry   : ${IMAGE_REGISTRY:-midnightntwrk}"
          docker compose --profile "$PROFILE" up -d

      - name: Show running containers
        run: docker compose ps

      - name: Wait for services to be healthy
        run: |
          # Wait for up to 60 seconds for all healthchecks to pass
          for i in $(seq 1 12); do
            echo "Check for services to be healthy... attempt $i"
            unhealthy=$(docker compose ps |grep -E 'unhealthy|starting' || true)
            if [ -z "$unhealthy" ]; then
              echo "All services healthy!"
              exit 0
            else
              echo "Unhealthy services: $unhealthy"
            fi
            sleep 5
          done
          echo "Some services failed to become healthy:"
          exit 1

      - name: Show logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  qa-undeployed:
    name: QA smoke + integration (undeployed)
    # needs build-and-push, NOT merge-manifests: this runner is amd64 and the
    # <tag>-amd64 images already exist by then, so the suite runs concurrently
    # with the manifest merge rather than after it. docker-compose-validation
    # deliberately stays on merge-manifests, so the merged multi-arch manifest
    # still has a consumer that exercises it.
    #
    # This does NOT overlap the arm64 QEMU builds: `needs` cannot name one leg
    # of a matrix, so it waits on all ten. Overlapping them means splitting
    # build-and-push into per-arch jobs - a bigger change to the release path,
    # not attempted here.
    needs: build-and-push
    # Tag builds have their own release verification flow.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    # Legal here in a way it is not on a job with `uses:`, which is the whole
    # reason this used to be a separate workflow_run-triggered workflow: a
    # failing QA suite must never red the image pipeline.
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Derive image tags
        id: tags
        uses: ./.github/actions/derive-image-tags
        with:
          node_tag: ${{ inputs.node_tag }}

      - name: Run QA suites against the freshly built images
        uses: ./.github/actions/qa-integration-tests
        with:
          target_env: undeployed
          # Per-arch tag: see the `needs:` note above.
          indexer_tag: ${{ steps.tags.outputs.indexer_tag }}-amd64
          node_tag: ${{ steps.tags.outputs.node_tag }}
          node_toolkit_tag: ${{ steps.tags.outputs.node_toolkit_tag }}
          # Must match `Set image registry` in build-and-push: Docker Hub
          # (midnightntwrk) only receives release-tag builds, so the per-commit
          # <version>-<sha8> images this job tests exist on GHCR alone. This job
          # never runs for a tag ref, so the registry is unconditional here.
          # midnight-ntwrk is the legacy GHCR org that build-and-push still
          # dual-publishes to; switch to midnightntwrk once it stops.
          image_registry: ghcr.io/midnight-ntwrk
          publish_to_xray: "false"
          packages_read_token: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}
          app_infra_secret: ${{ secrets.APP__INFRA__SECRET }}
          storage_password: ${{ secrets.APP__INFRA__STORAGE__PASSWORD }}
          pub_sub_password: ${{ secrets.APP__INFRA__PUB_SUB__PASSWORD }}
