name: ci-standalone

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - feat/*
      - release/*
  # Runs on main populate the Rust cache that pull requests restore from.
  push:
    branches:
      - main
    paths-ignore:
      - qa/**
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.head_ref || github.run_id}}
  cancel-in-progress: true

env:
  # Line tables keep backtraces readable while shrinking the cached target directory.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Detects whether the PR touches anything outside `qa/**`. Subsequent jobs
  # only skip when the PR is qa-only, so qa-only PRs skip Rust CI while this
  # workflow still reports success (keeping branch protection happy). If this
  # job fails they still run, so a failed detection never passes as qa-only.
  changes:
    runs-on: ubuntu-latest
    outputs:
      non_qa: ${{steps.filter.outputs.non_qa}}
      toolchain: ${{steps.set_toolchain.outputs.toolchain}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect non-qa changes
        id: filter
        uses: ./.github/actions/detect-non-qa-changes

      - name: Set toolchain
        id: set_toolchain
        env:
          toolchain_toml: "rust-toolchain.toml"
        run: |
          toolchain=$(grep channel rust-toolchain.toml | sed -r 's/channel = "(.*)"/\1/')
          echo "toolchain=$toolchain" | tee -a "$GITHUB_OUTPUT"

  fmt-check:
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{!cancelled() && needs.changes.outputs.non_qa != 'false'}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt
          toolchain: ${{needs.changes.outputs.toolchain}}

      - name: Install just
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just

      - name: just fmt-check
        run: |
          just feature=standalone fmt-check

  lint:
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{!cancelled() && needs.changes.outputs.non_qa != 'false'}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{needs.changes.outputs.toolchain}}
          components: clippy

      - name: Install just
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The default key is the job id, which ci-cloud shares.
          key: standalone
          # PR caches are visible only to their own PR, so only main saves.
          save-if: ${{github.ref == 'refs/heads/main'}}

      - name: Init Env Vars
        uses: ./.github/actions/init-env

      - name: just lint
        run: |
          rustup override set ${{needs.changes.outputs.toolchain}}
          just feature=standalone lint

  test:
    runs-on: ubuntu-latest-8-core-x64
    needs: [changes]
    if: ${{!cancelled() && needs.changes.outputs.non_qa != 'false'}}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pre-pull Docker images
        run: |
          NODE_VERSION=$(tail -n 1 NODE_VERSIONS)
          # Node 3.0.0 builds are published to GHCR only.
          # Native e2e runs the node image under its Docker Hub name.
          NODE_IMAGE="ghcr.io/midnightntwrk/midnight-node:$NODE_VERSION"
          echo "Pre-pulling $NODE_IMAGE..."
          docker pull "$NODE_IMAGE" || \
          docker pull "$NODE_IMAGE" || \
          docker pull "$NODE_IMAGE"
          docker tag "$NODE_IMAGE" "midnightntwrk/midnight-node:$NODE_VERSION"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{needs.changes.outputs.toolchain}}

      - name: Install nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest

      - name: Install just
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The default key is the job id, which ci-cloud shares.
          key: standalone
          # PR caches are visible only to their own PR, so only main saves.
          save-if: ${{github.ref == 'refs/heads/main'}}

      - name: Init Env Vars
        uses: ./.github/actions/init-env

      - name: just test
        run: |
          rustup override set ${{needs.changes.outputs.toolchain}}
          just feature=standalone test

  doc:
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{!cancelled() && needs.changes.outputs.non_qa != 'false'}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          components: rust-docs
          toolchain: ${{needs.changes.outputs.toolchain}}

      - name: Install just
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The default key is the job id, which ci-cloud shares.
          key: standalone
          # PR caches are visible only to their own PR, so only main saves.
          save-if: ${{github.ref == 'refs/heads/main'}}

      - name: just doc
        run: |
          git config --global url."https://@github.com".insteadOf "ssh://git@github.com"
          just feature=standalone doc
