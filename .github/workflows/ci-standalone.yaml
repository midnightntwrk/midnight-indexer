name: ci-standalone

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - feat/*
      - release/*
  merge_group:
  # Runs on main populate the Rust cache that pull requests restore from.
  push:
    branches:
      - main
    paths-ignore:
      - qa/**
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.head_ref || github.run_id}}
  cancel-in-progress: true

env:
  # Line tables keep backtraces readable while shrinking the cached target directory.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Detects whether the PR touches anything outside `qa/**`. Subsequent jobs
  # only skip when the PR is qa-only, so qa-only PRs skip Rust CI while this
  # workflow still reports success (keeping branch protection happy). If this
  # job fails they still run, so a failed detection never passes as qa-only.
  changes:
    runs-on: ubuntu-latest
    outputs:
      non_qa: ${{steps.filter.outputs.non_qa}}
      toolchain: ${{steps.set_toolchain.outputs.toolchain}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect non-qa changes
        id: filter
        uses: ./.github/actions/detect-non-qa-changes

      - name: Set toolchain
        id: set_toolchain
        env:
          toolchain_toml: "rust-toolchain.toml"
        run: |
          toolchain=$(grep channel rust-toolchain.toml | sed -r 's/channel = "(.*)"/\1/')
          echo "toolchain=$toolchain" | tee -a "$GITHUB_OUTPUT"

  fmt-check:
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{!cancelled() && needs.changes.outputs.non_qa != 'false'}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          components: rustfmt
          toolchain: ${{needs.changes.outputs.toolchain}}

      - name: Install just
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just

      - name: just fmt-check
        run: |
          just feature=standalone fmt-check

  lint:
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{!cancelled() && needs.changes.outputs.non_qa != 'false'}}
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Checkout's GitHub token would take precedence over the fetch credential.
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{needs.changes.outputs.toolchain}}
          components: clippy

      - name: Install just
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The default key is the job id, which ci-cloud shares.
          key: standalone
          # PR caches are visible only to their own PR, so only main saves.
          save-if: ${{github.ref == 'refs/heads/main'}}

      - &fetch
        name: Fetch Cargo dependencies
        if: github.event.repository.private
        env:
          FETCH_TOKEN: ${{ secrets.FETCH_TOKEN || secrets.NODE_GIT_TOKEN }}
        run: |
          if [[ -n "$FETCH_TOKEN" ]]; then
            bash ./fetch_cargo_dependencies.sh
          fi

      - name: Init Env Vars
        uses: ./.github/actions/init-env

      - name: just lint
        run: |
          rustup override set ${{needs.changes.outputs.toolchain}}
          just feature=standalone lint

      # No other job builds the heap profiling feature. This is the feature selection from
      # docs/heap-profiling.md, so that build keeps working.
      - name: just lint (jemalloc-profiling)
        run: |
          cargo clippy -p indexer-standalone --no-deps \
            --features standalone,indexer-common/jemalloc-profiling -- -D warnings

  test-without-package-access:
    runs-on: ${{ vars.TEST_RUNNER || 'ubuntu-latest-8-core-x64' }}
    needs: [changes]
    if: >-
      ${{ !cancelled() && needs.changes.outputs.non_qa != 'false' &&
          !(github.event.repository.private && startsWith(vars.NODE_IMAGE, 'ghcr.io/')) }}
    timeout-minutes: 15
    env: &test-env
      NODE_IMAGE: ${{ vars.NODE_IMAGE || 'ghcr.io/midnightntwrk/midnight-node' }}
    steps: &test-steps
      - *checkout

      - name: Login to GHCR
        if: github.job == 'test-with-package-access'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        env:
          NODE_IMAGE_TOKEN: >-
            ${{ (vars.NODE_IMAGE_TOKEN == 'MIDNIGHTCI_PACKAGES_READ' && secrets.MIDNIGHTCI_PACKAGES_READ) ||
                (vars.NODE_IMAGE_TOKEN != 'MIDNIGHTCI_PACKAGES_READ' && secrets.NODE_IMAGE_TOKEN) || '' }}
        with:
          registry: ghcr.io
          username: ${{ env.NODE_IMAGE_TOKEN != '' && vars.NODE_IMAGE_USERNAME || github.actor }}
          password: ${{ (vars.NODE_IMAGE_USERNAME && env.NODE_IMAGE_TOKEN) || github.token }}

      - name: Pre-pull Docker images
        run: |
          NODE_VERSION=$(tail -n 1 NODE_VERSIONS)
          echo "Pre-pulling $NODE_IMAGE:$NODE_VERSION..."
          docker pull "$NODE_IMAGE:$NODE_VERSION" || \
          docker pull "$NODE_IMAGE:$NODE_VERSION" || \
          docker pull "$NODE_IMAGE:$NODE_VERSION"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{needs.changes.outputs.toolchain}}

      - name: Install nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest

      - name: Install just
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The default key is the job id, which ci-cloud shares.
          key: standalone
          # PR caches are visible only to their own PR, so only main saves.
          save-if: ${{github.ref == 'refs/heads/main'}}

      - name: Init Env Vars
        uses: ./.github/actions/init-env

      - *fetch

      - name: just test
        run: |
          rustup override set ${{needs.changes.outputs.toolchain}}
          just feature=standalone test

  # Package access is limited to private repositories because PR code can disclose pulled images.
  test-with-package-access:
    runs-on: ${{ vars.TEST_RUNNER || 'ubuntu-latest-8-core-x64' }}
    needs: [changes]
    if: >-
      ${{ !cancelled() && needs.changes.outputs.non_qa != 'false' &&
          github.event.repository.private && startsWith(vars.NODE_IMAGE, 'ghcr.io/') }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env: *test-env
    steps: *test-steps

  # Branch protection requires one test check, regardless of which job has package access.
  test:
    needs: [changes, test-without-package-access, test-with-package-access]
    if: ${{ always() && needs.changes.outputs.non_qa != 'false' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check test result
        env:
          WITHOUT_PACKAGE_ACCESS: ${{ needs.test-without-package-access.result }}
          WITH_PACKAGE_ACCESS: ${{ needs.test-with-package-access.result }}
        run: |
          printf 'Without package access: %s\nWith package access: %s\n' "$WITHOUT_PACKAGE_ACCESS" "$WITH_PACKAGE_ACCESS"
          [[ "$WITHOUT_PACKAGE_ACCESS/$WITH_PACKAGE_ACCESS" == success/skipped ||
             "$WITHOUT_PACKAGE_ACCESS/$WITH_PACKAGE_ACCESS" == skipped/success ]]

  doc:
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{!cancelled() && needs.changes.outputs.non_qa != 'false'}}
    steps:
      - *checkout

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          components: rust-docs
          toolchain: ${{needs.changes.outputs.toolchain}}

      - name: Install just
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The default key is the job id, which ci-cloud shares.
          key: standalone
          # PR caches are visible only to their own PR, so only main saves.
          save-if: ${{github.ref == 'refs/heads/main'}}

      - *fetch

      - name: just doc
        run: |
          git config --global url."https://@github.com".insteadOf "ssh://git@github.com"
          just feature=standalone doc
