name: ci-standalone

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - feat/*
      - release/*
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.head_ref || github.run_id}}
  cancel-in-progress: true

jobs:
  # Detects whether the PR touches anything outside `qa/**`. Subsequent jobs
  # only skip when the PR is qa-only, so qa-only PRs skip Rust CI while this
  # workflow still reports success (keeping branch protection happy). If this
  # job fails they still run, so a failed detection never passes as qa-only.
  changes:
    runs-on: ubuntu-latest
    outputs:
      non_qa: ${{steps.filter.outputs.non_qa}}
      toolchain: ${{steps.set_toolchain.outputs.toolchain}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect non-qa changes
        id: filter
        uses: ./.github/actions/detect-non-qa-changes

      - name: Set toolchain
        id: set_toolchain
        env:
          toolchain_toml: "rust-toolchain.toml"
        run: |
          toolchain=$(grep channel rust-toolchain.toml | sed -r 's/channel = "(.*)"/\1/')
          echo "toolchain=$toolchain" | tee -a "$GITHUB_OUTPUT"

  fmt-check:
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{!cancelled() && needs.changes.outputs.non_qa != 'false'}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt
          toolchain: ${{needs.changes.outputs.toolchain}}

      - name: Install just
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: just fmt-check
        run: |
          just feature=standalone fmt-check

  lint:
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{!cancelled() && needs.changes.outputs.non_qa != 'false'}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{needs.changes.outputs.toolchain}}
          components: clippy

      - name: Install just
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Init Env Vars
        uses: ./.github/actions/init-env

      - name: just lint
        run: |
          rustup override set ${{needs.changes.outputs.toolchain}}
          just feature=standalone lint

  test:
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{!cancelled() && needs.changes.outputs.non_qa != 'false'}}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pre-pull Docker images
        run: |
          NODE_VERSION=$(tail -n 1 NODE_VERSIONS)
          echo "Pre-pulling midnight-node:$NODE_VERSION..."
          docker pull "midnightntwrk/midnight-node:$NODE_VERSION" || \
          docker pull "midnightntwrk/midnight-node:$NODE_VERSION" || \
          docker pull "midnightntwrk/midnight-node:$NODE_VERSION"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{needs.changes.outputs.toolchain}}

      - name: Install nextest
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: nextest

      - name: Install just
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Init Env Vars
        uses: ./.github/actions/init-env

      - name: just test
        run: |
          rustup override set ${{needs.changes.outputs.toolchain}}
          just feature=standalone test

  doc:
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{!cancelled() && needs.changes.outputs.non_qa != 'false'}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          components: rust-docs
          toolchain: ${{needs.changes.outputs.toolchain}}

      - name: Install just
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: just doc
        run: |
          git config --global url."https://@github.com".insteadOf "ssh://git@github.com"
          just feature=standalone doc
