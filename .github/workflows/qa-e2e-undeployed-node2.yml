name: Indexer QA E2E Tests - undeployed, node 2.x

# The e2e project is run by no other job: the QA base workflow executes only the smoke and
# integration projects, and against a with-data stack. The failed-segment suite needs a
# from-genesis stack and an explicitly pinned node, so it gets its own job.
#
# Nightly runs the main line against the newest published main build, resolved here and
# published to $GITHUB_ENV so the test step sees it. Other release lines run on dispatch with
# their tags given explicitly, because a branch head has no tag this checkout can derive.
#
# Negative control, which this workflow deliberately does NOT run: the suite's block-advance
# case cannot fail on a post-#1386 build, so it is given teeth by dispatching this workflow
# with indexer_tag=4.4.0-rc.3 and node_tag=2.0.0-rc.4, where it must go red with the
# chain-indexer's own ContractNotPresent fatal. Expected cadence: once per release of the 4.4
# line, and whenever the craft or the toolkit pairing changes.

permissions:
  contents: read
  packages: read

on:
  schedule:
    # 03:30 UTC, after the nightly image builds.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      node_tag:
        type: string
        # Keep in step with the job-level fallback below.
        description: Node tag (must be 2.x for the 4.4 line)
        required: false
        default: "2.1.0-rc.4"
      indexer_tag:
        type: string
        description: Indexer tag (empty resolves the newest published main build)
        required: false
        default: ""
      image_registry:
        type: string
        description: Registry for the indexer images
        required: false
        default: "ghcr.io/midnight-ntwrk"

concurrency:
  # The stack binds fixed host ports, so these runs cannot overlap.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  failed-segment-e2e:
    name: Contract deploy in a rolled-back fallible segment
    runs-on: ubuntu-latest
    # The suite's own beforeAll budget is ~20 minutes; this bounds a wedged toolkit well
    # short of the runner's six-hour default.
    timeout-minutes: 60
    env:
      TARGET_ENV: undeployed
      LOG_LEVEL: DEBUG
      # Keep in step with the dispatch input default above.
      NODE_TAG: ${{ inputs.node_tag || '2.1.0-rc.4' }}
      IMAGE_REGISTRY: ${{ inputs.image_registry || 'ghcr.io/midnight-ntwrk' }}
      # INDEXER_TAG is deliberately NOT set here: a job-level value would shadow the resolved
      # one published to $GITHUB_ENV by the startup step, and on a schedule event `inputs` is
      # empty, so it would be the empty string — which the suite rejects at collection time.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # resolve_indexer_image walks back from the merge-base with main, so the default
          # shallow checkout is not enough.
          fetch-depth: 0

      - name: Setup Node.js v22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: MidnightCI
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      - name: Startup local environment from genesis
        env:
          INDEXER_TAG: ${{ inputs.indexer_tag }}
          APP__INFRA__SECRET: ${{ secrets.APP__INFRA__SECRET }}
          APP__INFRA__STORAGE__PASSWORD: ${{ secrets.APP__INFRA__STORAGE__PASSWORD }}
          APP__INFRA__PUB_SUB__PASSWORD: ${{ secrets.APP__INFRA__PUB_SUB__PASSWORD }}
        run: |
          # The local environment is ephemeral; empty passwords make postgres restart-loop.
          export APP__INFRA__SECRET="${APP__INFRA__SECRET:-$(openssl rand -hex 32)}"
          export APP__INFRA__STORAGE__PASSWORD="${APP__INFRA__STORAGE__PASSWORD:-$(openssl rand -hex 32)}"
          export APP__INFRA__PUB_SUB__PASSWORD="${APP__INFRA__PUB_SUB__PASSWORD:-$(openssl rand -hex 32)}"

          # Resolve the images here rather than inside the startup script: that script runs in
          # its own shell, so anything it exports is gone by the next step. The test suite
          # reads INDEXER_TAG to decide which release line it is testing and refuses to run
          # without it, and the toolkit wrapper falls back to latest-main — which cannot parse
          # node 2.x blocks — when NODE_TOOLKIT_TAG is missing.
          . ./qa/scripts/_lib.sh
          resolve_indexer_image || exit 1
          export NODE_TOOLKIT_TAG="${NODE_TOOLKIT_TAG:-$NODE_TAG}"
          {
            echo "INDEXER_TAG=$INDEXER_TAG"
            echo "IMAGE_REGISTRY=$IMAGE_REGISTRY"
            echo "NODE_TOOLKIT_TAG=$NODE_TOOLKIT_TAG"
          } >> "$GITHUB_ENV"
          export INDEXER_TAG IMAGE_REGISTRY

          docker pull alpine
          docker pull "ghcr.io/midnight-ntwrk/midnight-node-toolkit:${NODE_TOOLKIT_TAG}"
          bash ./qa/scripts/startup-localenv-from-genesis.sh

      - name: Install dependencies
        working-directory: qa/tests
        run: bun install --frozen-lockfile

      - name: Run the failed-segment e2e suite
        working-directory: qa/tests
        run: |
          echo "Running against INDEXER_TAG=$INDEXER_TAG on NODE_TAG=$NODE_TAG with toolkit $NODE_TOOLKIT_TAG"
          bun run test:e2e tests/e2e/contract-deploy-failed-segment.test.ts

      - name: Fail a run that asserted nothing
        if: always()
        working-directory: qa/tests
        run: |
          # A suite that skipped itself exits 0, which would read as a green nightly having
          # checked nothing.
          report=reports/json/test-results.json
          test -f "$report" || { echo "no JSON report at $report"; exit 1; }
          passed=$(node -e "process.stdout.write(String(require('./$report').numPassedTests ?? 0))")
          echo "the suite passed $passed test(s)"
          if [ "$passed" -eq 0 ]; then
            echo "no test asserted anything — treating this run as a failure"
            exit 1
          fi

      - name: Collect container logs
        if: failure()
        run: |
          mkdir -p container-logs
          for service in chain-indexer indexer-api node; do
            docker compose --profile cloud logs --no-color "$service" \
              > "container-logs/${service}.log" 2>&1 || true
          done

      - name: Upload container logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: container-logs-e2e-failed-segment
          path: ./container-logs
          if-no-files-found: warn

      - name: Upload test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: junit-e2e-failed-segment-reports
          path: |
            ./qa/tests/reports/junit/test-results.xml
            ./qa/tests/reports/json/test-results.json
          if-no-files-found: warn

      - name: Tear down the local environment
        if: always()
        run: docker compose --profile cloud down -v --remove-orphans || true
