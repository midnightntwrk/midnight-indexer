name: Indexer QA Integration Tests Base workflow

# Note this is the base workflow used by the other
# qa-integration-tests-<environment>.yml workflows

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      target_env:
        type: choice
        description: Midnight target environment (devnet/qanet/preview/preprod)
        required: true
        default: qanet
        options:
          - devnet
          - qanet
          - preview
          - preprod
      publish_to_xray:
        type: boolean
        description: Publish the test results to Xray
        required: false
        default: false
      ref:
        type: string
        description: Git ref
        required: false
        default: main
      node_tag:
        type: string
        required: true
        description: Node ta
        default: latest
      indexer_tag:
        type: string
        required: true
        description: Indexer tag
        default: latest
      node_toolkit_tag:
        type: string
        required: false
        description: Node toolkit tag (leave empty for the startup script default)
        default: ""
  workflow_call:
    inputs:
      target_env:
        type: string
        description: Midnight target environment (devnet/qanet/preview/preprod)
        required: true
        default: qanet
      ref:
        type: string
        description: Git ref
        required: false
      publish_to_xray:
        type: boolean
        description: Publish the test results to Xray
        required: false
        default: false
      node_tag:
        type: string
        description: Node tag
        required: false
        default: latest
      indexer_tag:
        type: string
        description: Indexer tag
        required: false
        default: latest
      node_toolkit_tag:
        type: string
        description: Node toolkit tag (leave empty for the startup script default)
        required: false
        default: ""
      image_registry:
        type: string
        description: >-
          Registry for the indexer images (leave empty for the docker-compose
          default, Docker Hub midnightntwrk). Per-commit main-branch builds
          are published to GHCR only, so callers that test those images must
          set this explicitly.
        required: false
        default: ""
    secrets:
      MIDNIGHTCI_PACKAGES_READ:
        required: true
      APP__INFRA__SECRET:
        required: false
      APP__INFRA__STORAGE__PASSWORD:
        required: false
      APP__INFRA__PUB_SUB__PASSWORD:
        required: false
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD:
        required: false
      XRAY_CLIENT_ID:
        required: false
      XRAY_CLIENT_SECRET:
        required: false

concurrency:
  group: ${{github.workflow}}-${{github.head_ref || github.run_id}}
  cancel-in-progress: true

# A thin wrapper around .github/actions/qa-integration-tests. The steps live in
# a composite so build-indexer-images can run the same suite as an ordinary
# `continue-on-error` job - which a job with `uses:` cannot be - instead of
# chaining a second workflow off a workflow_run trigger.
jobs:
  basic-integration-tests:
    name: Execute basic integration tests
    permissions:
      packages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: ./.github/actions/qa-integration-tests
        with:
          target_env: ${{ inputs.target_env }}
          node_tag: ${{ inputs.node_tag }}
          indexer_tag: ${{ inputs.indexer_tag }}
          node_toolkit_tag: ${{ inputs.node_toolkit_tag }}
          image_registry: ${{ inputs.image_registry }}
          publish_to_xray: ${{ inputs.publish_to_xray }}
          packages_read_token: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}
          app_infra_secret: ${{ secrets.APP__INFRA__SECRET }}
          storage_password: ${{ secrets.APP__INFRA__STORAGE__PASSWORD }}
          pub_sub_password: ${{ secrets.APP__INFRA__PUB_SUB__PASSWORD }}
          xray_client_id: ${{ secrets.XRAY_CLIENT_ID }}
          xray_client_secret: ${{ secrets.XRAY_CLIENT_SECRET }}
