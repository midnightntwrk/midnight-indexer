name: Indexer QA Integration Tests Base workflow

# Note this is the base workflow used by the other
# qa-integration-tests-<environment>.yml workflows

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      target_env:
        type: choice
        description: Midnight target environment (devnet/qanet/preview/preprod)
        required: true
        default: qanet
        options:
          - devnet
          - qanet
          - preview
          - preprod
      publish_to_xray:
        type: boolean
        description: Publish the test results to Xray
        required: false
        default: false
      ref:
        type: string
        description: Git ref
        required: false
        default: main
      node_tag:
        type: string
        required: true
        description: Node ta
        default: latest
      indexer_tag:
        type: string
        required: true
        description: Indexer tag
        default: latest
  workflow_call:
    inputs:
      target_env:
        type: string
        description: Midnight target environment (devnet/qanet/preview/preprod)
        required: true
        default: qanet
      ref:
        type: string
        description: Git ref
        required: false
      publish_to_xray:
        type: boolean
        description: Publish the test results to Xray
        required: false
        default: false
      node_tag:
        type: string
        description: Node tag
        required: false
        default: latest
      indexer_tag:
        type: string
        description: Indexer tag
        required: false
        default: latest
      image_registry:
        type: string
        description: >-
          Registry for the indexer images (leave empty for the docker-compose
          default, Docker Hub midnightntwrk). Per-commit main-branch builds
          are published to GHCR only, so callers that test those images must
          set this explicitly.
        required: false
        default: ""
    secrets:
      MIDNIGHTCI_PACKAGES_READ:
        required: true
      APP__INFRA__SECRET:
        required: false
      APP__INFRA__STORAGE__PASSWORD:
        required: false
      APP__INFRA__PUB_SUB__PASSWORD:
        required: false
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD:
        required: false
      XRAY_CLIENT_ID:
        required: false
      XRAY_CLIENT_SECRET:
        required: false

concurrency:
  group: ${{github.workflow}}-${{github.head_ref || github.run_id}}
  cancel-in-progress: true

jobs:
  basic-integration-tests:
    name: Execute basic integration tests
    permissions:
      packages: read
    env:
      TARGET_ENV: ${{ inputs.target_env }}
      GITHUB_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}
      NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}
      LOG_LEVEL: DEBUG
      XRAY_COMPONENT: "indexer"
      XRAY_PROJECT_KEY: "PM"
      XRAY_TEST_PLAN_KEY: "PM-19197"
      XRAY_REPORT_TESTS_MISSING_METADATA: "false"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v 6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js v22.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.x

      - name: Restore Yarn cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  
        with:
          path: |
            qa/tests/.yarn/cache
            qa/tests/.yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('qa/tests/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 #v4.1.0
        with:
          registry: ghcr.io
          username: MidnightCI
          password: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}

      # Pulling up front keeps registry/auth/tag failures out of the startup
      # step (they fail here with a one-glance log instead) and lets the step
      # timings separate download time from environment startup time. Images
      # already present make this a cheap manifest check.
      - name: Pull images
        if: inputs.target_env == 'undeployed'
        env:
          NODE_TAG: ${{ inputs.node_tag }}
          INDEXER_TAG: ${{ inputs.indexer_tag }}
          IMAGE_REGISTRY: ${{ inputs.image_registry }}
        run: |
          docker compose --profile cloud pull
          # Used by qa/scripts/startup-localenv-with-data.sh for volume setup.
          docker pull alpine
          # Used by the toolkit wrapper for test data generation; the registry
          # is hardcoded there (qa/tests/utils/toolkit/toolkit-wrapper.ts) and
          # this pull must match it. The tag default mirrors
          # startup-localenv-with-data.sh. Docker Hub's
          # midnightntwrk/midnight-node-toolkit cannot be used here: it only
          # carries the toolkit's own release tags and latest-main, not the
          # node-paired tags this workflow passes.
          docker pull "ghcr.io/midnight-ntwrk/midnight-node-toolkit:${NODE_TOOLKIT_TAG:-latest-main}"

      - name: Startup local environment
        if: inputs.target_env == 'undeployed'
        env:
          NODE_TAG: ${{ inputs.node_tag }}
          INDEXER_TAG: ${{ inputs.indexer_tag }}
          # Empty falls through to the docker-compose default (midnightntwrk).
          IMAGE_REGISTRY: ${{ inputs.image_registry }}
          APP__INFRA__SECRET: ${{ secrets.APP__INFRA__SECRET }}
          APP__INFRA__STORAGE__PASSWORD: ${{ secrets.APP__INFRA__STORAGE__PASSWORD }}
          APP__INFRA__PUB_SUB__PASSWORD: ${{ secrets.APP__INFRA__PUB_SUB__PASSWORD }}
        run: |
          # No APP__INFRA__* secrets are configured for this repo (repo and
          # org level), leaving these empty — an empty POSTGRES_PASSWORD makes
          # the postgres container restart-loop and the whole environment
          # never comes up. The local environment is ephemeral, so random
          # values suffice (same approach as .github/actions/init-env);
          # secrets still win when present.
          export APP__INFRA__SECRET="${APP__INFRA__SECRET:-$(openssl rand -hex 32)}"
          export APP__INFRA__STORAGE__PASSWORD="${APP__INFRA__STORAGE__PASSWORD:-$(openssl rand -hex 32)}"
          export APP__INFRA__PUB_SUB__PASSWORD="${APP__INFRA__PUB_SUB__PASSWORD:-$(openssl rand -hex 32)}"

          . ./.envrc
          echo "NODE_TAG: $NODE_TAG"
          echo "INDEXER_TAG: $INDEXER_TAG"
          bash ./qa/scripts/startup-localenv-with-data.sh

      - name: Install dependencies
        working-directory: qa/tests
        run: yarn install --immutable

      - name: Run smoke tests
        working-directory: qa/tests
        run: yarn test smoke

      - name: Run integration tests
        working-directory: qa/tests
        run: yarn test integration

      - name: Generate API coverage report (non-blocking)
        if: always()
        continue-on-error: true
        working-directory: qa/tests
        run: |
          yarn coverage:generate --target-env=${{ inputs.target_env }} --indexer-api-version=v4

      - name: Publish to Xray
        if: always() && inputs.publish_to_xray == true
        uses: GiuseppeSalvatoreShielded/TestActions/xray-upload@e5cf0c100e61b96f5bc73963312fc8064d7b2d2d
        with:
          test_results_path: ./qa/tests/reports/xray/test-results.json
          xray_client_id: ${{ secrets.XRAY_CLIENT_ID }}
          xray_client_secret: ${{ secrets.XRAY_CLIENT_SECRET }}

      - name: Upload Integration Test Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: junit-integration-test-reports
          path: ./qa/tests/reports/custom-junit-report.xml
          if-no-files-found: warn

      - name: Upload XRay Test Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: xray-integration-test-reports
          path: ./qa/tests/reports/xray/test-results.json
          if-no-files-found: warn

      - name: Upload logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qa-integration-tests-${{ inputs.target_env }}-logs
          path: |
            ./qa/tests/logs

      - name: Upload API coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qa-api-coverage-${{ inputs.target_env }}
          path: ./qa/tests/coverage/output/**
          if-no-files-found: warn
