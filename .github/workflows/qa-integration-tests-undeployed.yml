name: Indexer QA Integration Tests - undeployed

permissions:
  contents: read
  # Required by the called base workflow's job (GHCR image pulls); a called
  # job cannot escalate beyond the caller's grant, so omitting this fails
  # run creation with startup_failure.
  packages: read

on:
  workflow_dispatch:
    inputs:
      node_tag:
        type: string
        description: Node tag
        required: false
        default: latest
      indexer_tag:
        type: string
        description: Indexer tag
        required: false
        default: latest
      image_registry:
        type: string
        description: >-
          Indexer image registry. Leave empty for Docker Hub (release tags only);
          per-commit main builds (<version>-<sha8>) are on ghcr.io/midnight-ntwrk.
        required: false
        default: ""

jobs:
  test:
    name: Indexer QA Integration Tests on undeployed
    uses: ./.github/workflows/qa-integration-tests-base-workflow.yml
    with:
      target_env: undeployed
      ref: main
      node_tag: ${{ inputs.node_tag }}
      indexer_tag: ${{ inputs.indexer_tag }}
      image_registry: ${{ inputs.image_registry }}
    secrets:
      MIDNIGHTCI_PACKAGES_READ: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}
      APP__INFRA__SECRET: ${{ secrets.APP__INFRA__SECRET }}
      APP__INFRA__STORAGE__PASSWORD: ${{ secrets.APP__INFRA__STORAGE__PASSWORD }}
      APP__INFRA__PUB_SUB__PASSWORD: ${{ secrets.APP__INFRA__PUB_SUB__PASSWORD }}
