name: Indexer QA Preview Subscriptions

on:
  workflow_call:
    inputs:
      suite:
        description: Block subscriptions or ledger events
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test - ${{ inputs.suite }}
    runs-on: >-
      ${{ vars.INDEXER_ARC_ENABLED == 'true' && github.repository == 'midnightntwrk/midnight-indexer' &&
      github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (inputs.suite == 'block-subscriptions' || inputs.suite == 'ledger-events') && 'arc-indexer-ci' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: qa/tests
    env:
      TARGET_ENV: preview
      INDEXER_API_VERSION: ${{ inputs.suite == 'block-subscriptions' && 'v3' || 'v4' }}
      LOG_LEVEL: DEBUG
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the selected suite
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          case "$SUITE" in
            block-subscriptions|ledger-events) ;;
            *) echo 'Unsupported preview subscription suite' >&2; exit 1 ;;
          esac

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          case "$SUITE" in
            block-subscriptions) bun run test:integration block-subscriptions ;;
            ledger-events) bun run test:integration ledger ;;
            *) exit 1 ;;
          esac

      - name: Generate API coverage report (non-blocking)
        if: always()
        continue-on-error: true
        run: bun run coverage:generate --target-env="$TARGET_ENV" --indexer-api-version="$INDEXER_API_VERSION"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-reports-${{ inputs.suite }}
          path: qa/tests/reports/**
          retention-days: 7

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-logs-${{ inputs.suite }}
          path: qa/tests/logs/**
          retention-days: 7

      - name: Upload API coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qa-api-coverage-${{ inputs.suite }}
          path: qa/tests/coverage/output/**
          retention-days: 7
