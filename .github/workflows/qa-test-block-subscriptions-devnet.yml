name: Indexer QA Block Streaming Test (Devnet)

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes on workdays (Mon-Fri), covering UK and US working hours (07:00-21:00 UTC)
    - cron: '*/30 7-21 * * 1-5'

# no top level default permissions for security reasons
permissions:
  contents: read

jobs:
  test-block-subscriptions:
    name: Test Block Subscriptions
    uses: midnightntwrk/midnight-indexer/.github/workflows/qa-test-block-subscription-base-workflow.yml@87910bdff7b1b528d8bca5ef9b4e33d4e1b0f15c
    with:
      target_env: devnet
      indexer_api_version: v4
