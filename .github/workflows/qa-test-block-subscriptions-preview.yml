name: Indexer QA Block Streaming Test (Preview)

on:
  workflow_dispatch:
  schedule:
    # Every 10 minutes on workdays (Mon-Fri), covering UK and US working hours (07:00-21:00 UTC)
    - cron: '*/10 7-21 * * 1-5'

# no top level default permissions for security reasons
permissions:
  contents: read

jobs:
  test-block-subscriptions:
    name: Test Block Subscriptions
    uses: midnightntwrk/midnight-indexer/.github/workflows/qa-preview-subscriptions.yml@683f17767ff0f056ca2344a10dd0e381941fdfef
    with:
      suite: block-subscriptions
