name: Indexer QA Block Streaming Test (QAnet)

# No schedule and no manual dispatch: this workflow has no trigger of its own.
on:
  workflow_call:

# no top level default permissions for security reasons
permissions:
  contents: read

jobs:
  test-block-subscriptions:
    name: Test Block Subscriptions
    uses: ./.github/workflows/qa-test-block-subscription-base-workflow.yml
    with:
      target_env: qanet
      indexer_api_version: v3
