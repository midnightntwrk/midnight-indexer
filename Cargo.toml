walkdir                     = { version = "2.5" }

# Ledger 9.1.0.0-rc.4, the ledger team's published patch set; the v8/v9
# coexistence shape traces to midnight-ledger#580. The rc crates aren't on
# crates.io yet, hence git tags. rc.3 -> rc.4 picks up the ledger dust
# registration accounting fix, mirroring midnight-node#2022.
#
# These pins match midnight-node 2.1.0-beta.1 crate for crate — same rc.4 tag on
# every v9-side crate, same `=8.1.1` / `=3.0.0` / `=3.1.0` v8 side, same
# `layout-v2` + `gc-v1` on storage-core, same `v8-to-v9-state-translation` rev.
# They have to: the indexer re-derives the translated arena root and compares it
# against the node's at the fork boundary. Re-check that parity against the
# node's workspace Cargo.toml whenever either side moves.
#
# rc.4 tags only the workspace (`ledger-9.1.0.0-rc.4`) - there are no per-crate
# rc.4 tags - so every v9-side crate points at that single tag (also more
# self-consistent than rc.3's mix of per-crate tags across several commits).
# `midnight-transient-crypto-old` stays on transient-crypto-2.2.0-rc.1: the 2.x
# crypto stack is frozen and rc.4 only ships 3.x.
#
# NEW in rc.4: midnight-storage / midnight-storage-core join this table. rc.4
# turned the ledger workspace's intra-repo deps into path deps on `digest 0.11`,
# while the crates.io releases of the same version numbers are on `digest 0.10`;
# cargo can't patch a path dep inside a git source, so without these two the
# v8<->v9 state translation stops type-checking. Both majors therefore share one
# `midnight-storage` 2.0.2 / `midnight-storage-core` 1.2.0 instance resolved from
# rc.4 rather than crates.io - which is what the node does too, and is required
# for the v8 and v9 states and the translation to share one arena.
#
# Entries without package/version replace their registry crate outright
# (base-crypto, base-crypto-derive, serialize, zkir, storage, storage-core;
# shared within-major or v9-only); the cross-major v9 crates carry package +
# version to patch only their major, leaving v8's registry versions intact.
[patch.crates-io]
midnight-base-crypto          = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-9.1.0.0-rc.4" }
midnight-base-crypto-derive   = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-9.1.0.0-rc.4" }
midnight-serialize            = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-9.1.0.0-rc.4" }
midnight-zkir                 = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-9.1.0.0-rc.4" }
midnight-storage              = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-9.1.0.0-rc.4" }
midnight-storage-core         = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-9.1.0.0-rc.4" }
midnight-transient-crypto-old = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "transient-crypto-2.2.0-rc.1", package = "midnight-transient-crypto", version = "2.2.0" }
midnight-ledger-v9            = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-9.1.0.0-rc.4" }
midnight-zswap_v9             = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-9.1.0.0-rc.4", package = "midnight-zswap",           version = "9.0.0" }
midnight-coin-structure_v3    = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-9.1.0.0-rc.4", package = "midnight-coin-structure",  version = "3.0.0" }
midnight-transient-crypto_v3  = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-9.1.0.0-rc.4", package = "midnight-transient-crypto", version = "3.0.0" }
midnight-onchain-runtime_v4   = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-9.1.0.0-rc.4", package = "midnight-onchain-runtime", version = "4.0.0" }
midnight-onchain-state_v4     = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-9.1.0.0-rc.4", package = "midnight-onchain-state",   version = "4.0.0" }
midnight-onchain-vm_v4        = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-9.1.0.0-rc.4", package = "midnight-onchain-vm",      version = "4.0.0" }
