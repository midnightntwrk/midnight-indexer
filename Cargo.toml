[workspace]
resolver = "2"
members = [
    "indexer-common",
    "chain-indexer",
    "wallet-indexer",
    "indexer-api",
    "indexer-standalone",
    "indexer-tests",
    "spo-indexer",
]

[workspace.package]
version       = "4.4.0-rc.5"
edition       = "2024"
license       = "Apache-2.0"
readme        = "README.md"
homepage      = "https://github.com/midnightntwrk/midnight-indexer"
repository    = "https://github.com/midnightntwrk/midnight-indexer"
documentation = "https://github.com/midnightntwrk/midnight-indexer"
publish       = false

[workspace.dependencies]
# LEDGER-10-ONLY BUILD. Ledger 8 and 9 are gated off behind the `legacy-ledgers`
# cargo feature, which cannot currently be enabled, and this table resolves the
# `ledger-10.1.0.0-alpha.1` workspace tag directly. That tag's crates carry
# `path = "../x"` deps, so they cannot share serialize / base-crypto /
# storage-core with the rc.5 crates ledger 8 and 9 pin; either generation set
# can be in the graph, not both, until the ledger team publishes per-crate
# isolate tags for ledger 10. The ledger-8/9 pins are kept below, commented out,
# as the record of what `legacy-ledgers` needs restored. Mirrors
# midnight-node#2173.
#
# base-crypto, serialize and storage-core stay plain version reqs and resolve
# through the `[patch.crates-io]` alpha-tag entries below.
midnight-base-crypto_v1       = { package = "midnight-base-crypto", version = "1" }
midnight-serialize_v1         = { package = "midnight-serialize", version = "1" }
midnight-storage-core_v1      = { package = "midnight-storage-core", version = "1.2" }

# Ledger 10, straight from the workspace tag. Path deps inside the tag resolve
# within it, so the whole cone is one instance.
#
# The `_v10` suffix names the ledger generation, not the crate major: the alpha
# ships onchain-runtime 5, onchain-state 4, transient-crypto 4, zswap 9 and
# coin-structure 3, whose majors overlap ledger 9's.
midnight-coin-structure_v10   = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-10.1.0.0-alpha.1", package = "midnight-coin-structure" }
midnight-ledger_v10           = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-10.1.0.0-alpha.1", package = "midnight-ledger-v10" }
midnight-onchain-runtime_v10  = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-10.1.0.0-alpha.1", package = "midnight-onchain-runtime" }
midnight-transient-crypto_v10 = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-10.1.0.0-alpha.1", package = "midnight-transient-crypto" }
midnight-zswap_v10            = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-10.1.0.0-alpha.1", package = "midnight-zswap" }

# --- legacy-ledgers (ledger 8 and 9), disabled --------------------------------
# Every crate that resolves from crates.io carries an `=` pin. The caret reqs all
# resolve through a `[patch.crates-io]` git tag below, which fixes their content
# whatever the req says.
#
# `v8-to-v9-state-translation` builds its v8 side from these exact types. The
# fork-boundary block compares the arena root it derives against the node's, so a
# req lifting one of these crates on a re-resolve breaks that block.
# midnight-node declares `coin-structure` as `^2.0.0`; the `=` pin here holds the
# version the node resolves to today.
# midnight-coin-structure_v2   = { package = "midnight-coin-structure", version = "=2.0.2" }
# midnight-ledger_v8           = { package = "midnight-ledger", version = "=8.1.2" }
# midnight-onchain-runtime_v3  = { package = "midnight-onchain-runtime", version = "=3.1.1" }
# midnight-onchain-state_v3    = { package = "midnight-onchain-state", version = "=3.0.1" }
# Full storage wrapper (state_translation framework); backs both ledger majors.
# midnight-storage_v2          = { package = "midnight-storage", version = "=2.0.4" }
# midnight-transient-crypto_v2 = { package = "midnight-transient-crypto", version = "2" }
# midnight-zswap_v8            = { package = "midnight-zswap", version = "=8.1.2" }
# midnight-coin-structure_v3   = { package = "midnight-coin-structure", version = "3" }
# midnight-ledger_v9           = { package = "midnight-ledger-v9", version = "1.0" }
# midnight-onchain-runtime_v4  = { package = "midnight-onchain-runtime", version = "4" }
# midnight-onchain-state_v4    = { package = "midnight-onchain-state", version = "4" }
# midnight-transient-crypto_v3 = { package = "midnight-transient-crypto", version = "3" }
# midnight-zswap_v9            = { package = "midnight-zswap", version = "9" }

