[workspace]
resolver = "2"
members = [
    "indexer-common",
    "chain-indexer",
    "wallet-indexer",
    "indexer-api",
    "indexer-standalone",
    "indexer-tests",
    "spo-indexer",
]

[workspace.package]
version       = "4.4.0-rc.5"
edition       = "2024"
license       = "Apache-2.0"
readme        = "README.md"
homepage      = "https://github.com/midnightntwrk/midnight-indexer"
repository    = "https://github.com/midnightntwrk/midnight-indexer"
documentation = "https://github.com/midnightntwrk/midnight-indexer"
publish       = false

[workspace.dependencies]
# Ledger v8 and v9, all from crates.io. base-crypto, serialize and storage-core are shared by both
# majors.
#
# These pins match midnight-node `node-2.1.101` crate for crate, and each carries
# an `=` pin. Where the node declares a caret req, the pin holds the version the
# node resolves to. `v8-to-v9-state-translation` builds on these exact types, and
# the fork-boundary block compares the arena root the indexer derives against the
# node's, so any drift breaks that block. Re-check parity against the node's
# `Cargo.lock` whenever either side moves.
midnight-base-crypto_v1      = { package = "midnight-base-crypto", version = "=1.1.1" }
midnight-coin-structure_v2   = { package = "midnight-coin-structure", version = "=2.0.2" }
midnight-ledger_v8           = { package = "midnight-ledger", version = "=8.1.3" }
midnight-onchain-runtime_v3  = { package = "midnight-onchain-runtime", version = "=3.1.2" }
midnight-onchain-state_v3    = { package = "midnight-onchain-state", version = "=3.0.2" }
midnight-serialize_v1        = { package = "midnight-serialize", version = "=1.2.1" }
# One storage-core instance gives the v8 and v9 states, and the translation, one
# arena.
midnight-storage-core_v1     = { package = "midnight-storage-core", version = "=1.2.3" }
# Ledger 8 storage. `v8-to-v9-state-translation` requires `^2.0.5`.
midnight-storage_v2          = { package = "midnight-storage", version = "=2.0.5" }
midnight-transient-crypto_v2 = { package = "midnight-transient-crypto", version = "=2.2.0" }
midnight-zswap_v8            = { package = "midnight-zswap", version = "=8.1.3" }
# Ledger v9
midnight-coin-structure_v3   = { package = "midnight-coin-structure", version = "=3.0.1" }
midnight-ledger_v9           = { package = "midnight-ledger-v9", version = "=1.0.1" }
midnight-onchain-runtime_v4  = { package = "midnight-onchain-runtime", version = "=4.0.1" }
midnight-onchain-state_v4    = { package = "midnight-onchain-state", version = "=4.0.1" }
# Ledger 9 storage. Its `Map` keys need `EncodingShape`, and it hosts the v8->v9
# state translation framework.
midnight-storage_v3          = { package = "midnight-storage", version = "=3.0.0" }
midnight-transient-crypto_v3 = { package = "midnight-transient-crypto", version = "=3.0.1" }
midnight-zswap_v9            = { package = "midnight-zswap", version = "=9.0.1" }
# Other dependencies.
anyhow                      = { version = "1.0" }
assert_matches              = { version = "1.5" }
async-graphql               = { version = "7.2" }
async-graphql-axum          = { version = "7.2" }
