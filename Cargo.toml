# LEDGER-10-ONLY: the shared stack resolves onto the `ledger-10.1.0.0-alpha.1`
# tree so it is one instance with the alpha's path deps.
# `midnight-transient-crypto-old` stays on its rc.1 tag, which the alpha itself
# needs; its serialize / base-crypto / storage-core deps are version deps, so
# they unify here too. Mirrors midnight-node#2173.
[patch.crates-io]
midnight-base-crypto          = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-10.1.0.0-alpha.1" }
midnight-base-crypto-derive   = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-10.1.0.0-alpha.1" }
midnight-serialize            = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-10.1.0.0-alpha.1" }
midnight-storage-core         = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-10.1.0.0-alpha.1" }
midnight-transient-crypto-old = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "transient-crypto-2.2.0-rc.1", package = "midnight-transient-crypto", version = "2.2.0" }

# --- legacy-ledgers rc.5 pins, disabled ---------------------------------------
# Ledger 9.1.0.0-rc.5, the ledger team's published patch set; the v8/v9
# coexistence shape traces to midnight-ledger#580. The rc crates aren't on
# crates.io yet, hence git tags. rc.4 -> rc.5 moves storage and storage-core to
# versions compatible with ledger 8.1.2, mirroring midnight-node#2096.
#
# These pins match midnight-node `node-2.1.0-rc.2` crate for crate — same
# per-crate rc tags on the v9 side, same `=8.1.2` / `=3.0.1` / `=3.1.1` v8 side,
# same `layout-v2` + `gc-v1` on storage-core, same `v8-to-v9-state-translation`
# rev. They have to: the indexer re-derives the translated arena root and
# compares it against the node's at the fork boundary. Re-check that parity
# against the node's workspace Cargo.toml whenever either side moves.
#
# ledger rc.5 is pinned per crate rather than through the single `ledger-9.1.0.0-rc.5`
# workspace tag, mirroring midnight-node#2134. The workspace tag is mutable — it
# was re-pointed days after the node locked it — and it drags every crate out of
# one checkout whose manifests still carry `path = "../x"` deps. The per-crate
# `isolate <tag>` commits are the same tree with those path deps rewritten to
# version deps, so cargo resolves each crate through this table instead of
# implicitly through one repo's directory layout. `midnight-ledger-static` needs
# its own entry for that reason: under the workspace tag it arrived free via
# `path = "../static"`, and crates.io stops at 9.0.0.
#
# `midnight-transient-crypto-old` stays on transient-crypto-2.2.0-rc.1: the 2.x
# crypto stack is frozen and rc.5 only ships 3.x.
#
# midnight-storage / midnight-storage-core are in this table because the ledger
# workspace's intra-repo deps are path deps on `digest 0.11`, while the crates.io
# releases of the same version numbers are on `digest 0.10`. Cargo cannot patch a
# path dep inside a git source, so without these two the v8<->v9 state
# translation stops type-checking. Both majors therefore share one
# `midnight-storage` 2.0.4 / `midnight-storage-core` 1.2.2 instance resolved from
# the rc tags, which is what lets the v8 and v9 states and the translation share
# one arena. The node resolves them the same way.
#
# Entries without package/version replace their registry crate outright
# (base-crypto, base-crypto-derive, serialize, zkir, storage, storage-core,
# ledger-static; shared within-major or v9-only); the cross-major v9 crates carry
# package + version to patch only their major, leaving v8's registry versions
# intact.
# midnight-base-crypto          = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "base-crypto-1.1.0-rc.3" }
# midnight-base-crypto-derive   = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "base-crypto-derive-1.1.0-rc.2" }
# midnight-serialize            = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "serialize-1.2.0-rc.2" }
# midnight-zkir                 = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "zkir-2.2.0-rc.4" }
# midnight-storage              = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "storage-2.0.4-rc.1" }
# midnight-storage-core         = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "storage-core-1.2.2-rc.1" }
# midnight-ledger-static        = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "crate-ledger-9.1.0.0-rc.5" }
# midnight-ledger-v9            = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "crate-ledger-9.1.0.0-rc.5" }
# midnight-zswap_v9             = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "zswap-9.0.0-rc.5",           package = "midnight-zswap",            version = "9.0.0" }
# midnight-coin-structure_v3    = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "coin-structure-3.0.0-rc.2",  package = "midnight-coin-structure",   version = "3.0.0" }
# midnight-transient-crypto_v3  = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "transient-crypto-3.0.0-rc.3", package = "midnight-transient-crypto", version = "3.0.0" }
# midnight-onchain-runtime_v4   = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "onchain-runtime-4.0.0-rc.4", package = "midnight-onchain-runtime",  version = "4.0.0" }
# midnight-onchain-state_v4     = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "onchain-state-4.0.0-rc.4",   package = "midnight-onchain-state",    version = "4.0.0" }
# midnight-onchain-vm_v4        = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "onchain-vm-4.0.0-rc.3",      package = "midnight-onchain-vm",       version = "4.0.0" }
