[package]
name          = "chain-indexer"
description   = "Chain Indexer"
version       = { workspace = true }
edition       = { workspace = true }
license       = { workspace = true }
readme        = { workspace = true }
homepage      = { workspace = true }
repository    = { workspace = true }
documentation = { workspace = true }
publish       = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [ "--cfg", "docsrs" ]

[dependencies]
anyhow             = { workspace = true }
async-stream       = { workspace = true }
byte-unit-serde    = { workspace = true }
const-hex          = { workspace = true }
derive_more        = { workspace = true, features = [ "from" ] }
fastrace           = { workspace = true, features = [ "enable" ] }
futures            = { workspace = true }
humantime-serde    = { workspace = true }
indexer-common     = { path = "../indexer-common" }
indoc              = { workspace = true }
itertools          = { workspace = true }
http               = { workspace = true }
log                = { workspace = true, features = [ "kv_std" ] }
metrics            = { workspace = true }
parity-scale-codec = { workspace = true }
parking_lot        = { workspace = true }
serde              = { workspace = true, features = [ "derive" ] }
sqlx               = { workspace = true, features = [ "time" ] }
subxt              = { workspace = true, features = [ "reconnecting-rpc-client" ] }
thiserror          = { workspace = true }
tokio              = { workspace = true, features = [ "macros", "rt-multi-thread", "time", "signal" ] }
trait-variant      = { workspace = true }

[dev-dependencies]
clap      = { workspace = true, features = [ "derive" ] }
const-hex = { workspace = true }
criterion = { workspace = true }
fake      = { workspace = true }
fs_extra  = { workspace = true }
indexer-common = { path = "../indexer-common", features = [ "testing" ] }
reqwest   = { workspace = true, features = [ "json", "rustls" ] }
serde     = { workspace = true, features = [ "derive" ] }
serde_json = { workspace = true }
tempfile  = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true, features = [ "postgres" ] }
walkdir   = { workspace = true }
# SPIKE — REMOVE BEFORE MERGE, together with tests/contract_state_arena.rs: the spike reaches
# into the ledger arena directly, which production chain-indexer code does not.
midnight-serialize_v1        = { workspace = true }
midnight-storage-core_v1     = { workspace = true, features = [ "layout-v2", "gc-v1" ] }
# --- legacy-ledgers (ledger 8 and 9), disabled --------------------------------
# midnight-coin-structure_v2  = { workspace = true }
# midnight-coin-structure_v3  = { workspace = true }
# midnight-onchain-runtime_v3 = { workspace = true }
# midnight-onchain-runtime_v4 = { workspace = true }
# midnight-zswap_v8           = { workspace = true }
# midnight-zswap_v9           = { workspace = true }

# Replays stagenet chain data, which is ledger-8/9 history.
[[test]]
name              = "contract_state_arena"
required-features = [ "legacy-ledgers", "standalone" ]

# Ingests node 1.0 chain data, which is a ledger-8 chain.
[[test]]
name              = "mainnet_runtime"
required-features = [ "legacy-ledgers" ]

[[bench]]
name              = "ledger_state"
harness           = false
required-features = [ "standalone" ]

[[bench]]
name              = "apply_transaction"
harness           = false
required-features = [ "legacy-ledgers", "standalone" ]

[[bench]]
name              = "preprod_genesis"
harness           = false
required-features = [ "legacy-ledgers", "standalone" ]

[build-dependencies]
anyhow             = { workspace = true }
itertools          = { workspace = true }
parity-scale-codec = { workspace = true }
subxt              = { workspace = true }

[features]
cloud      = [ "indexer-common/cloud" ]
standalone = [ "indexer-common/standalone" ]
# Ledger 8 and 9 support. Cannot currently be enabled: their rc.5 crates and the
# ledger-10 alpha's path-dep tree cannot coexist in one graph (see the workspace
# Cargo.toml). Kept as the cfg the gated code is written against, so re-enabling
# is a Cargo.toml change, not a rewrite.
legacy-ledgers = [ "indexer-common/legacy-ledgers" ]
