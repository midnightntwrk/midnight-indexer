thread_stack_size: "24MiB"

application:
  network_id: "undeployed"
  caught_up_max_distance: 10
  caught_up_leeway: 5
  # Budget for one gc pass per block it covers; the pass gets gc_bound * gc_interval.
  gc_bound: "200ms"
  # Run gc every N blocks with N times the budget: same duty cycle, far fewer partial marks.
  gc_interval: 25
  # Sample the ledger DB node count every N blocks, or never if 0. Each sample is a full scan.
  arena_metrics_interval: 0
  # Recent blocks whose ledger states stay loadable (gc roots). Must comfortably exceed
  # indexer-api's dust_generations max_snapshot_age.
  ledger_state_retention: 1000
  # Threads decoding sourced blocks; by default one less than the available cores, leaving one
  # for node I/O and indexing.
  # decode_cpu_threads: 7

infra:
  run_migrations: true

  storage:
    host: "localhost"
    port: 5432
    dbname: "indexer"
    user: "indexer"
    sslmode: "prefer"
    max_connections: 10
    idle_timeout: "1m"
    max_lifetime: "5m"

  ledger_db:
    cache_max_nodes: 100000

  pub_sub:
    url: "localhost:4222"
    username: "indexer"
    max_reconnects: 4

  node:
    url: "ws://localhost:9944"
    reconnect_max_delay: "10s" # 10ms, 100ms, 1s, 10s
    reconnect_max_attempts: 30 # Failed tries, roughly 5m, before the node counts as unreachable
    subscription_recovery_timeout: "30s" # Re-subscribe if no follow event received within this time
    # Block sourcing. Heights per chunk; keep it at least 8 times application.decode_cpu_threads
    # so one chunk keeps the decode threads busy.
    source_chunk_size: 64
    # Chunks in progress, and sourced chunks waiting for decode. Blocks held in memory are bounded
    # by about 2 x source_chunks_ahead x source_chunk_size.
    source_chunks_ahead: 8
    # Calls per JSON-RPC batch. A node or proxy may reject large batches; public endpoints accept
    # 64 over WebSocket.
    rpc_batch_size: 64
    # JSON-RPC batches in flight on the node connection.
    rpc_batches_in_flight: 16

telemetry:
  tracing:
    enabled: false
    service_name: "chain-indexer"
    otlp_exporter_endpoint: "http://localhost:4317"
  metrics:
    enabled: false
    address: "0.0.0.0"
    port: 9000
