[package]
name          = "indexer-tests"
description   = "Tests for the Midnight Indexer"
version       = { workspace = true }
edition       = { workspace = true }
license       = { workspace = true }
readme        = { workspace = true }
homepage      = { workspace = true }
repository    = { workspace = true }
documentation = { workspace = true }
publish       = { workspace = true }

[dependencies]
anyhow            = { workspace = true }
clap              = { workspace = true, features = [ "derive" ] }
derive_more       = { workspace = true, features = [ "display" ] }
futures           = { workspace = true }
graphql_client    = { workspace = true, features = [ "reqwest-rustls" ] }
indexer-api       = { path = "../indexer-api" }
indexer-common    = { path = "../indexer-common" }
itertools         = { workspace = true }
reqwest           = { workspace = true, features = [ "json", "rustls" ] }
serde             = { workspace = true, features = [ "derive" ] }
serde_json        = { workspace = true }
tokio             = { workspace = true, features = [ "macros", "process", "rt-multi-thread" ] }
tokio-stream      = { workspace = true }
tokio-tungstenite = { workspace = true, features = [ "rustls-tls-webpki-roots" ] }

[dev-dependencies]
bech32                 = { workspace = true }
fs_extra               = { workspace = true }
nix                    = { workspace = true, features = [ "signal" ] }
tempfile               = { workspace = true }
testcontainers         = { workspace = true }
testcontainers-modules = { workspace = true, features = [ "postgres" ] }
walkdir                = { workspace = true }

# Drives the ledger-8 -> 9 boundary against node images this build cannot index.
[[test]]
name              = "hardfork_e2e"
required-features = [ "legacy-ledgers", "standalone" ]

[features]
cloud      = [ "indexer-api/cloud" ]
standalone = [ "indexer-api/standalone" ]
# Ledger 8 and 9 support. Cannot currently be enabled: their rc.5 crates and the
# ledger-10 alpha's path-dep tree cannot coexist in one graph (see the workspace
# Cargo.toml). Kept as the cfg the gated code is written against, so re-enabling
# is a Cargo.toml change, not a rewrite.
legacy-ledgers = [ "indexer-common/legacy-ledgers" ]
